<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-labelledby="dsa-hero-title dsa-hero-desc">
  <title id="dsa-hero-title">DSA - Interactive Algorithms and Problem Tracker</title>
  <desc id="dsa-hero-desc">Hero banner for the DSA TypeScript, React, Cloudscape, and Monaco Editor workspace.</desc>
  <defs>
    <style>
      .dsa-h-display { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.02em; }
      .dsa-h-sub { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #CBD5E1; }
      .dsa-h-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #A3E635; }
      .dsa-h-chip-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 500; fill: #E2E8F0; }
      .dsa-h-box { fill: none; stroke: #334155; stroke-width: 1.25; }
      .dsa-h-accent-box { fill: none; stroke: #65A30D; stroke-width: 1.5; }
      .dsa-h-edge { fill: none; stroke: #475569; stroke-width: 1.25; stroke-dasharray: 4 3; animation: dsaEdgeDash 14s linear infinite; }
      .dsa-h-node { fill: none; stroke: #334155; stroke-width: 1.25; }
      .dsa-h-signal { fill: #A3E635; }
      .dsa-h-dot { fill: #A3E635; animation: dsaDotPulse 2.2s ease-in-out infinite; }
      .dsa-h-ring { fill: none; stroke: #A3E635; stroke-width: 1.2; animation: dsaRingExpand 2.2s ease-out infinite; }
      .dsa-h-cursor { fill: #A3E635; animation: dsaCursorBlink 1.1s steps(2, start) infinite; }

      .dsa-h-tag-1, .dsa-h-tag-2, .dsa-h-tag-3 {
        opacity: 0;
        animation: dsaTagCycle 10.5s ease-in-out infinite;
      }
      .dsa-h-tag-1 { animation-delay: 0s; }
      .dsa-h-tag-2 { animation-delay: 3.5s; }
      .dsa-h-tag-3 { animation-delay: 7s; }

      .dsa-h-pill { fill: none; stroke: #334155; stroke-width: 1.25; animation: dsaPillWave 7.5s ease-in-out infinite; }
      .dsa-h-pill-t { animation: dsaPillTextWave 7.5s ease-in-out infinite; }
      .dsa-h-p1 { animation-delay: 0s; }
      .dsa-h-p2 { animation-delay: 1.5s; }
      .dsa-h-p3 { animation-delay: 3.0s; }
      .dsa-h-p4 { animation-delay: 4.5s; }
      .dsa-h-p5 { animation-delay: 6.0s; }

      /* Tree traversal sync (6s) */
      .dsa-h-tn-root { animation: dsaNodePulse 6s ease-in-out infinite 0s; }
      .dsa-h-tn-mid { animation: dsaNodePulse 6s ease-in-out infinite 2s; }
      .dsa-h-tn-leaf { animation: dsaNodePulse 6s ease-in-out infinite 4s; }

      /* Array scan sync (5s) */
      .dsa-h-arr-0 { animation: dsaArrPulse 5s ease-in-out infinite 0s; }
      .dsa-h-arr-1 { animation: dsaArrPulse 5s ease-in-out infinite 1s; }
      .dsa-h-arr-2 { animation: dsaArrPulse 5s ease-in-out infinite 2s; }
      .dsa-h-arr-3 { animation: dsaArrPulse 5s ease-in-out infinite 3s; }
      .dsa-h-arr-4 { animation: dsaArrPulse 5s ease-in-out infinite 4s; }

      @keyframes dsaEdgeDash { to { stroke-dashoffset: -140; } }
      @keyframes dsaDotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes dsaRingExpand { 0% { r: 4; opacity: 0.8; } 100% { r: 10; opacity: 0; } }
      @keyframes dsaCursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes dsaTagCycle {
        0% { opacity: 0; transform: translateY(4px); }
        5%, 28% { opacity: 1; transform: translateY(0); }
        33%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes dsaPillWave {
        0%, 100% { stroke: #334155; stroke-width: 1.25; }
        10%, 22% { stroke: #A3E635; stroke-width: 1.7; }
      }
      @keyframes dsaPillTextWave {
        0%, 100% { fill: #E2E8F0; }
        10%, 22% { fill: #A3E635; }
      }
      @keyframes dsaNodePulse {
        0%, 40%, 100% { stroke: #334155; stroke-width: 1.25; }
        10%, 28% { stroke: #A3E635; stroke-width: 1.9; }
      }
      @keyframes dsaArrPulse {
        0%, 30%, 100% { stroke: #334155; stroke-width: 1.25; }
        8%, 20% { stroke: #A3E635; stroke-width: 1.8; }
      }

      @media (prefers-color-scheme: light) {
        .dsa-h-display { fill: #0F172A; }
        .dsa-h-sub { fill: #475569; }
        .dsa-h-mono { fill: #4D7C0F; }
        .dsa-h-chip-txt { fill: #1E293B; }
        .dsa-h-box, .dsa-h-node { stroke: #CBD5E1; }
        .dsa-h-accent-box { stroke: #65A30D; }
        .dsa-h-edge { stroke: #94A3B8; }
        .dsa-h-signal, .dsa-h-dot, .dsa-h-cursor { fill: #4D7C0F; }
        .dsa-h-ring { stroke: #4D7C0F; }
        .dsa-h-pill { stroke: #CBD5E1; animation-name: dsaPillWaveLight; }
        .dsa-h-pill-t { fill: #1E293B; animation-name: dsaPillTextWaveLight; }
        .dsa-h-tn-root, .dsa-h-tn-mid, .dsa-h-tn-leaf { animation-name: dsaNodePulseLight; }
        .dsa-h-arr-0, .dsa-h-arr-1, .dsa-h-arr-2, .dsa-h-arr-3, .dsa-h-arr-4 { animation-name: dsaArrPulseLight; }
      }
      @keyframes dsaPillWaveLight {
        0%, 100% { stroke: #CBD5E1; stroke-width: 1.25; }
        10%, 22% { stroke: #65A30D; stroke-width: 1.7; }
      }
      @keyframes dsaPillTextWaveLight {
        0%, 100% { fill: #1E293B; }
        10%, 22% { fill: #4D7C0F; }
      }
      @keyframes dsaNodePulseLight {
        0%, 40%, 100% { stroke: #CBD5E1; stroke-width: 1.25; }
        10%, 28% { stroke: #65A30D; stroke-width: 1.9; }
      }
      @keyframes dsaArrPulseLight {
        0%, 30%, 100% { stroke: #CBD5E1; stroke-width: 1.25; }
        8%, 20% { stroke: #65A30D; stroke-width: 1.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dsa-h-edge, .dsa-h-dot, .dsa-h-ring, .dsa-h-cursor,
        .dsa-h-pill, .dsa-h-pill-t,
        .dsa-h-tag-2, .dsa-h-tag-3,
        .dsa-h-tn-root, .dsa-h-tn-mid, .dsa-h-tn-leaf,
        .dsa-h-arr-0, .dsa-h-arr-1, .dsa-h-arr-2, .dsa-h-arr-3, .dsa-h-arr-4 {
          animation: none !important;
        }
        .dsa-h-edge { stroke-dasharray: none; }
        .dsa-h-tag-1 { animation: none !important; opacity: 1; transform: none; }
        .dsa-h-tag-2, .dsa-h-tag-3 { opacity: 0; }
        .dsa-h-ring, .dsa-h-signal { display: none; }
      }
    </style>
  </defs>

  <!-- Left: Typography & Stack Chips -->
  <g transform="translate(24, 34)">
    <rect x="0" y="0" width="186" height="26" rx="2" class="dsa-h-accent-box"/>
    <circle cx="13" cy="13" r="4" class="dsa-h-ring"/>
    <circle cx="13" cy="13" r="4" class="dsa-h-dot"/>
    <text x="26" y="17.5" class="dsa-h-mono">TS / REACT / MONACO</text>

    <text x="0" y="88" class="dsa-h-display">DSA</text>
    <rect x="112" y="50" width="4" height="42" rx="0" class="dsa-h-cursor"/>

    <g>
      <text x="0" y="118" class="dsa-h-sub dsa-h-tag-1">Algorithmic Problem Tracker &amp; In-Browser Practice Workspace</text>
      <text x="0" y="118" class="dsa-h-sub dsa-h-tag-2">Topic &amp; Subtopic Hierarchy with Real-Time Multi-Facet Filtering</text>
      <text x="0" y="118" class="dsa-h-sub dsa-h-tag-3">Embedded Monaco Editor (8 Languages) with LocalStorage Sync</text>
    </g>

    <!-- Stack Chips -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="106" height="30" rx="2" class="dsa-h-pill dsa-h-p1"/>
      <text x="53" y="19.5" text-anchor="middle" class="dsa-h-chip-txt dsa-h-pill-t dsa-h-p1">TypeScript</text>

      <rect x="116" y="0" width="88" height="30" rx="2" class="dsa-h-pill dsa-h-p2"/>
      <text x="160" y="19.5" text-anchor="middle" class="dsa-h-chip-txt dsa-h-pill-t dsa-h-p2">React 18</text>

      <rect x="214" y="0" width="124" height="30" rx="2" class="dsa-h-pill dsa-h-p3"/>
      <text x="276" y="19.5" text-anchor="middle" class="dsa-h-chip-txt dsa-h-pill-t dsa-h-p3">Monaco Editor</text>

      <rect x="348" y="0" width="112" height="30" rx="2" class="dsa-h-pill dsa-h-p4"/>
      <text x="404" y="19.5" text-anchor="middle" class="dsa-h-chip-txt dsa-h-pill-t dsa-h-p4">Cloudscape</text>

      <rect x="470" y="0" width="76" height="30" rx="2" class="dsa-h-pill dsa-h-p5"/>
      <text x="508" y="19.5" text-anchor="middle" class="dsa-h-chip-txt dsa-h-pill-t dsa-h-p5">Vite 5</text>
    </g>
  </g>

  <!-- Right: Geometric Binary Tree / Complexity Motif -->
  <g transform="translate(620, 32)">
    <!-- Edges -->
    <line x1="128" y1="34" x2="64" y2="92" class="dsa-h-edge"/>
    <line x1="128" y1="34" x2="192" y2="92" class="dsa-h-edge"/>
    <line x1="64" y1="92" x2="32" y2="150" class="dsa-h-edge"/>
    <line x1="64" y1="92" x2="96" y2="150" class="dsa-h-edge"/>
    <line x1="192" y1="92" x2="160" y2="150" class="dsa-h-edge"/>
    <line x1="192" y1="92" x2="224" y2="150" class="dsa-h-edge"/>

    <!-- Travelling traversal signal down O(1) -> log n -> L2 -->
    <circle r="3.2" class="dsa-h-signal">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 128 34 L 64 92 L 96 150" keyPoints="0;0.5;1" keyTimes="0;0.5;1" calcMode="linear" />
    </circle>

    <!-- Root Node -->
    <rect x="104" y="14" width="48" height="28" rx="2" class="dsa-h-node dsa-h-tn-root"/>
    <text x="128" y="32.5" text-anchor="middle" class="dsa-h-mono">O(1)</text>

    <!-- Level 1 Nodes -->
    <rect x="38" y="78" width="52" height="28" rx="2" class="dsa-h-node dsa-h-tn-mid"/>
    <text x="64" y="96.5" text-anchor="middle" class="dsa-h-mono">log n</text>

    <rect x="166" y="78" width="52" height="28" rx="2" class="dsa-h-node"/>
    <text x="192" y="96.5" text-anchor="middle" class="dsa-h-chip-txt">O(n)</text>

    <!-- Level 2 Nodes -->
    <rect x="10" y="144" width="44" height="26" rx="0" class="dsa-h-node"/>
    <text x="32" y="161.5" text-anchor="middle" class="dsa-h-chip-txt">L1</text>

    <rect x="74" y="144" width="44" height="26" rx="0" class="dsa-h-node dsa-h-tn-leaf"/>
    <text x="96" y="161.5" text-anchor="middle" class="dsa-h-mono">L2</text>

    <rect x="138" y="144" width="44" height="26" rx="0" class="dsa-h-node"/>
    <text x="160" y="161.5" text-anchor="middle" class="dsa-h-chip-txt">L3</text>

    <rect x="202" y="144" width="44" height="26" rx="0" class="dsa-h-node"/>
    <text x="224" y="161.5" text-anchor="middle" class="dsa-h-chip-txt">L4</text>

    <!-- Index Array Strip -->
    <g transform="translate(10, 186)">
      <rect x="0" y="0" width="48" height="24" rx="0" class="dsa-h-box dsa-h-arr-0"/>
      <text x="24" y="16.5" text-anchor="middle" class="dsa-h-chip-txt">[0]</text>
      <rect x="48" y="0" width="48" height="24" rx="0" class="dsa-h-box dsa-h-arr-1"/>
      <text x="72" y="16.5" text-anchor="middle" class="dsa-h-chip-txt">[1]</text>
      <rect x="96" y="0" width="48" height="24" rx="0" class="dsa-h-box dsa-h-arr-2"/>
      <text x="120" y="16.5" text-anchor="middle" class="dsa-h-mono">[2]</text>
      <rect x="144" y="0" width="48" height="24" rx="0" class="dsa-h-box dsa-h-arr-3"/>
      <text x="168" y="16.5" text-anchor="middle" class="dsa-h-chip-txt">[3]</text>
      <rect x="192" y="0" width="48" height="24" rx="0" class="dsa-h-box dsa-h-arr-4"/>
      <text x="216" y="16.5" text-anchor="middle" class="dsa-h-chip-txt">[4]</text>
    </g>
  </g>
</svg>
